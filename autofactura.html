<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Autofactura | INOVANTARIO</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#17213a;background:#f4f6fb}body{margin:0;padding:24px}.card{max-width:560px;margin:30px auto;background:#fff;border-radius:22px;padding:28px;box-shadow:0 12px 40px #17213a18}.brand{font-weight:800;color:#365b9d;letter-spacing:.08em}h1{margin:8px 0}.total{font-size:2rem;font-weight:800;color:#365b9d}label{display:block;margin:15px 0;font-weight:650}input{box-sizing:border-box;width:100%;margin-top:6px;padding:14px;border:1px solid #aeb6c7;border-radius:12px;font-size:16px;text-transform:uppercase}input[type=email]{text-transform:none}button{width:100%;border:0;border-radius:14px;padding:15px;background:#4568a4;color:#fff;font-size:17px;font-weight:750;cursor:pointer}button:disabled{opacity:.55}.note{font-size:13px;color:#647087}.uuid{overflow-wrap:anywhere}#message{line-height:1.5}.error{color:#a22}.success{color:#176538}
  </style>
</head>
<body>
  <main class="card"><div class="brand">INOVANTARIO</div><div id="content"><h1>Autofactura</h1><p>Consultando ticket…</p></div></main>
  <script>
    const token=new URLSearchParams(location.search).get('token')||'';
    const endpoint='https://zuxxbpooxvqipocjgjoq.supabase.co/functions/v1/autofactura';
    const content=document.getElementById('content');
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const download=(xml,id)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([xml],{type:'application/xml'}));a.download='CFDI-'+id+'.xml';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
    async function call(body){const response=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||'No se pudo completar la operación.');return data}
    async function load(){try{const ticket=await call({action:'public_ticket',token});if(ticket.status==='invoiced'){content.innerHTML='<h1>Factura generada</h1><p>Este ticket ya fue facturado.</p><p class="uuid">UUID: '+escapeHtml(ticket.invoice_uuid)+'</p><button id="download">Descargar XML</button>';document.getElementById('download').onclick=()=>download(ticket.invoice_xml,ticket.invoice_uuid);return}if(!['pending','error'].includes(ticket.status))throw new Error('Este ticket no está disponible para facturar.');content.innerHTML='<h1>Autofactura</h1><p>Ticket <b>'+escapeHtml(ticket.ticket_number)+'</b></p><p class="total">'+Number(ticket.total).toLocaleString('es-MX',{style:'currency',currency:'MXN'})+'</p><form id="form"><label>RFC<input name="rfc" maxlength="13" required></label><label>Nombre o razón social<input name="legal_name" required></label><label>Código postal fiscal<input name="postal_code" inputmode="numeric" maxlength="5" required></label><label>Régimen fiscal<input name="tax_regime" inputmode="numeric" maxlength="3" placeholder="Ej. 612" required></label><label>Uso del CFDI<input name="cfdi_use" maxlength="3" placeholder="Ej. G03" required></label><label>Correo electrónico<input name="email" type="email" required></label><button>Generar factura</button><p class="note">Verifica tus datos. Al timbrar ya no podrán editarse.</p><p id="message"></p></form>';document.getElementById('form').onsubmit=submit}catch(error){content.innerHTML='<h1>Ticket no disponible</h1><p class="error">'+escapeHtml(error.message)+'</p>'}}
    async function submit(event){event.preventDefault();const button=event.target.querySelector('button'),message=document.getElementById('message');button.disabled=true;message.className='';message.textContent='Generando factura…';try{const customer=Object.fromEntries(new FormData(event.target));const result=await call({action:'invoice_ticket',token,customer});message.className='success';message.innerHTML='<b>Factura generada correctamente.</b><br>UUID: '+escapeHtml(result.uuid);download(result.cfdi_xml,result.uuid)}catch(error){message.className='error';message.textContent=error.message;button.disabled=false}}
    load();
  </script>
</body>
</html>
