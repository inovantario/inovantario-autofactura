<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Autofactura | INOVANTARIO</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#17213a;background:#f4f6fb}body{margin:0;padding:24px}.card{max-width:560px;margin:30px auto;background:#fff;border-radius:22px;padding:28px;box-shadow:0 12px 40px #17213a18}.brand{font-weight:800;color:#365b9d;letter-spacing:.08em}h1{margin:8px 0}.total{font-size:2rem;font-weight:800;color:#365b9d}label{display:block;margin:15px 0;font-weight:650}input,select{box-sizing:border-box;width:100%;margin-top:6px;padding:14px;border:1px solid #aeb6c7;border-radius:12px;background:#fff;font-size:16px}input{text-transform:uppercase}input[type=email]{text-transform:none}button{width:100%;margin-top:10px;border:0;border-radius:14px;padding:15px;background:#4568a4;color:#fff;font-size:17px;font-weight:750;cursor:pointer}button.secondary{background:#eef2fa;color:#284d8b}.invoice{margin:20px 0;padding:18px;border:1px solid #d5dbea;border-radius:14px}.invoice p{margin:7px 0}.note{font-size:13px;color:#647087}.uuid{overflow-wrap:anywhere}#message{line-height:1.5}.error{color:#a22}.success{color:#176538}@media print{body{background:#fff;padding:0}.card{max-width:none;margin:0;box-shadow:none}.no-print{display:none!important}}
  </style>
</head>
<body>
  <main class="card"><div class="brand">INOVANTARIO</div><div id="content"><h1>Autofactura</h1><p>Consultando ticket…</p></div></main>
  <script>
    const token=new URLSearchParams(location.search).get('token')||'';
    const endpoint='https://zuxxbpooxvqipocjgjoq.supabase.co/functions/v1/autofactura';
    const content=document.getElementById('content');
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const download=(xml,id)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([xml],{type:'application/xml'}));a.download='CFDI-'+id+'.xml';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
    async function call(body){const response=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||'No se pudo completar la operación.');return data}
    function invoiceView(xml,uuid){const doc=new DOMParser().parseFromString(xml,'application/xml'),one=name=>doc.getElementsByTagNameNS('*',name)[0],c=one('Comprobante'),e=one('Emisor'),r=one('Receptor');const attr=(node,name)=>node?.getAttribute(name)||'';return '<h1>Factura generada</h1><div class="invoice"><p><b>Serie/Folio:</b> '+escapeHtml(attr(c,'Serie')+'-'+attr(c,'Folio'))+'</p><p><b>Fecha:</b> '+escapeHtml(attr(c,'Fecha'))+'</p><p><b>Emisor:</b> '+escapeHtml(attr(e,'Nombre'))+' · '+escapeHtml(attr(e,'Rfc'))+'</p><p><b>Receptor:</b> '+escapeHtml(attr(r,'Nombre'))+' · '+escapeHtml(attr(r,'Rfc'))+'</p><p><b>Total:</b> '+Number(attr(c,'Total')).toLocaleString('es-MX',{style:'currency',currency:'MXN'})+'</p><p class="uuid"><b>UUID:</b> '+escapeHtml(uuid)+'</p><p>Este documento es una representación impresa de un CFDI. El XML es el comprobante fiscal.</p></div><div class="no-print"><button id="download">Descargar XML</button><button class="secondary" id="pdf">Guardar PDF</button></div>'}
    const regimes='<option value="">Selecciona tu régimen</option><option value="601">601 · General de Ley Personas Morales</option><option value="603">603 · Personas Morales con Fines no Lucrativos</option><option value="605">605 · Sueldos y Salarios</option><option value="606">606 · Arrendamiento</option><option value="607">607 · Enajenación o Adquisición de Bienes</option><option value="608">608 · Demás ingresos</option><option value="610">610 · Residentes en el Extranjero</option><option value="611">611 · Ingresos por Dividendos</option><option value="612">612 · Actividades Empresariales y Profesionales</option><option value="614">614 · Ingresos por intereses</option><option value="615">615 · Obtención de premios</option><option value="616">616 · Sin obligaciones fiscales</option><option value="620">620 · Sociedades Cooperativas</option><option value="621">621 · Incorporación Fiscal</option><option value="622">622 · Actividades Agrícolas</option><option value="623">623 · Opcional para Grupos de Sociedades</option><option value="624">624 · Coordinados</option><option value="625">625 · Plataformas Tecnológicas</option><option value="626">626 · Régimen Simplificado de Confianza</option>';
    const uses='<option value="">Selecciona el uso del CFDI</option><option value="G01">G01 · Adquisición de mercancías</option><option value="G02">G02 · Devoluciones, descuentos o bonificaciones</option><option value="G03">G03 · Gastos en general</option><option value="I01">I01 · Construcciones</option><option value="I02">I02 · Mobiliario y equipo de oficina</option><option value="I03">I03 · Equipo de transporte</option><option value="I04">I04 · Equipo de cómputo</option><option value="I05">I05 · Dados, troqueles y moldes</option><option value="I06">I06 · Comunicaciones telefónicas</option><option value="I07">I07 · Comunicaciones satelitales</option><option value="I08">I08 · Otra maquinaria y equipo</option><option value="D01">D01 · Honorarios médicos</option><option value="D02">D02 · Gastos médicos por incapacidad</option><option value="D03">D03 · Gastos funerales</option><option value="D04">D04 · Donativos</option><option value="D05">D05 · Intereses hipotecarios</option><option value="D06">D06 · Aportaciones voluntarias al SAR</option><option value="D07">D07 · Primas por seguros médicos</option><option value="D08">D08 · Transportación escolar</option><option value="D09">D09 · Depósitos para el ahorro</option><option value="D10">D10 · Pagos por servicios educativos</option><option value="S01">S01 · Sin efectos fiscales</option><option value="CP01">CP01 · Pagos</option><option value="CN01">CN01 · Nómina</option>';
    async function load(){try{const ticket=await call({action:'public_ticket',token});if(ticket.status==='invoiced'){content.innerHTML=invoiceView(ticket.invoice_xml,ticket.invoice_uuid);document.getElementById('download').onclick=()=>download(ticket.invoice_xml,ticket.invoice_uuid);document.getElementById('pdf').onclick=()=>window.print();return}if(!['pending','error'].includes(ticket.status))throw new Error('Este ticket no está disponible para facturar.');content.innerHTML='<h1>Autofactura</h1><p>Ticket <b>'+escapeHtml(ticket.ticket_number)+'</b></p><p class="total">'+Number(ticket.total).toLocaleString('es-MX',{style:'currency',currency:'MXN'})+'</p><form id="form"><label>RFC<input name="rfc" maxlength="13" required></label><label>Nombre o razón social<input name="legal_name" required></label><label>Código postal fiscal<input name="postal_code" inputmode="numeric" maxlength="5" required></label><label>Régimen fiscal<select name="tax_regime" required>'+regimes+'</select></label><label>Uso del CFDI<select name="cfdi_use" required>'+uses+'</select></label><label>Correo electrónico<input name="email" type="email" required></label><button>Generar factura</button><p class="note">Verifica tus datos. Al timbrar ya no podrán editarse.</p><p id="message"></p></form>';document.getElementById('form').onsubmit=submit}catch(error){content.innerHTML='<h1>Ticket no disponible</h1><p class="error">'+escapeHtml(error.message)+'</p>'}}
    async function submit(event){event.preventDefault();const button=event.target.querySelector('button'),message=document.getElementById('message');button.disabled=true;message.className='';message.textContent='Generando factura…';try{const customer=Object.fromEntries(new FormData(event.target));const result=await call({action:'invoice_ticket',token,customer});message.className='success';message.innerHTML='<b>Factura generada correctamente.</b><br>UUID: '+escapeHtml(result.uuid);download(result.cfdi_xml,result.uuid)}catch(error){message.className='error';message.textContent=error.message;button.disabled=false}}
    load();
  </script>
</body>
</html>
